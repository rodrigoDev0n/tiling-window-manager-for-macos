[package]
name = "tiling_window"
version = "0.1.0"
edition = "2024"

[dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
libc = "0.2.190"
objc2 = { version = "0.6.5", default-features = false, features = ["std", "alloc"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "NSScreen", "NSGraphics", "objc2-core-foundation", "libc", "NSApplication", "NSWindow", "NSPanel", "NSView", "NSText", "NSTextView", "NSVisualEffectView", "NSColor", "NSFont", "NSFontDescriptor", "NSEvent", "NSResponder", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSEnumerator", "NSDictionary", "NSNotification", "NSOperation", "block2", "NSGeometry", "NSRunLoop", "NSDate"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
